<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurador 3D - Moveis Parametricos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="product-name">Configurador de Moveis 3D</h1>
  </header>

  <main class="layout">
    <aside id="side-panel" class="panel">
      <h2 id="side-panel-title">Atributos do movel</h2>
      <div id="float-actions">
        <div id="rotate-panel" style="display:none;">
          <label class="control-label" for="rotate-slider">Rotação <span id="rotate-value" class="control-value">0°</span></label>
          <input id="rotate-slider" class="control-slider" type="range" min="-180" max="180" step="1" value="0">
        </div>
        <button id="move-toggle" class="fab" type="button" title="Mover móvel" aria-label="Mover móvel">
          <img src="assets/icons/move.svg" alt="" onerror="this.remove()">
          <span aria-hidden="true">⤢</span>
        </button>
        <button id="rotate-toggle" class="fab" type="button" title="Rotacionar" aria-label="Rotacionar">
          <img src="assets/icons/rotate.svg" alt="" onerror="this.remove()">
          <span aria-hidden="true">⟳</span>
        </button>
      </div>
      <div class="price-box">
        <span>Preco estimado:</span>
        <strong id="price">-</strong>
      </div>
      <div id="side-panel-body"></div>
      <ul id="warnings" class="warnings"></ul>
      <div id="add-model">
        <h2>Adicionar móvel</h2>
        <div id="catalog-list"></div>
        <div id="add-model-status" class="control-hint"></div>
      </div>
    </aside>
    <section class="viewer-wrap">
      <div id="canvas-container">
        <canvas id="canvas"></canvas>
      </div>
      <div id="overlay">
        <p>Carregando modelo 3D...</p>
      </div>
    </section>
  </main>

  <script src="js/viewer-loader.js"></script>
  <script src="js/config.js"></script>
  <script src="js/shapediver.js"></script>
  <script src="js/constraints.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/main.js"></script>
  <script src="js/room.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/furniture-move.js"></script>
  <script src="js/furniture-rotate.js"></script>
  <script src="js/furniture-add.js"></script>
</body>
</html>
